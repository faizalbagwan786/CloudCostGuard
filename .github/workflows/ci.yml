name: CloudCostGuard CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Unit Tests & Code Quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Code Formatting & Lint Checks
        run: |
          flake8 src tests --count --max-line-length=120 --statistics

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --cov=cloudcostguard --cov-report=term-missing

      - name: Test CLI Demo Scan Execution
        run: |
          python -m cloudcostguard.cli scan --demo --html ci_report.html --json-output ci_findings.json
          test -s ci_report.html
          test -s ci_findings.json

  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: cloudcostguard:latest
