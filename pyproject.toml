[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudcostguard"
version = "1.0.0"
authors = [
  { name="Faizal Bagwan", email="faizalmohdrafiquebagwan@gmail.com" },
]
description = "AWS FinOps Cloud Cost Optimizer & Multi-Resource Automation Engine"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
cloudcostguard = "cloudcostguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src"]
